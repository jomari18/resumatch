name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Test adapters and dummy secrets only; no real keys are used in CI.
  AI_PROVIDER: fake
  STORE: memory
  ALLOW_TEST_ADAPTERS: "1"
  IP_HASH_SALT: ci-ip-salt-ci-ip-salt-ci-ip-salt-ci
  RESULT_SIGNING_SECRET: ci-signing-secret-ci-signing-secret
  NEXT_PUBLIC_SITE_URL: http://localhost:3100

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: resumatch_test
        ports:
          - 55454:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55454/resumatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
      - run: npm run test:db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
